# The gate that makes the harness binding for every agent and every human: lint, tests, coverage ratchet.
# Make it required on main (bootstrap step 6) or it is advice.
name: harness-gates
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harness lint
        run: python scripts/harness_lint.py
      - name: Tests
        # Fill in bootstrap step 6. Must write a Cobertura XML at the path named in coverage_baseline.json.
        run: pip install pytest pytest-cov && ./test tests scripts/tests
      - name: Coverage ratchet
        run: python scripts/harness_lint.py --ratchet
  visitor-pr:
    # A visitor's PR changes only going/<slug>/<login>.md and people/<login>/, and every going/ and people/ file is
    # plain, small and holds no email or phone (scripts/check_visitor_pr.py). pull_request, never
    # pull_request_target: the PR's commits are only read, with a read-only token and no secrets. The event's values
    # reach the script through env, never pasted into the shell line.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Visitor PR check
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_OWNER: ${{ github.event.repository.owner.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The base branch's copy of the checker runs, so a PR cannot rewrite the rules it is judged by;
          # the PR's own copy only while the base has none (the PR that adds it).
          if git cat-file -e "$BASE_SHA:scripts/check_visitor_pr.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/check_visitor_pr.py" > "$RUNNER_TEMP/check_visitor_pr.py"
          else
            echo "the base has no checker yet; running the PR's copy"
            cp scripts/check_visitor_pr.py "$RUNNER_TEMP/check_visitor_pr.py"
          fi
          python -I "$RUNNER_TEMP/check_visitor_pr.py" --base "$BASE_SHA" --head "$HEAD_SHA" --author "$PR_AUTHOR" --owner "$REPO_OWNER"
